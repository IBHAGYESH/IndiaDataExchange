tags:
  - name: user
    description: User profile and dashboard

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header

paths:
  /api/user/profile:
    get:
      security:
        - Bearer: []
      tags:
        - user
      summary: Get current user profile with stats
      responses:
        '200':
          description: User profile
          schema:
            type: object
            properties:
              user:
                $ref: '#/definitions/User'
        '401':
          description: Not authenticated

  /api/user/account:
    delete:
      security:
        - Bearer: []
      tags:
        - user
      summary: Delete account and anonymise marketplace data
      responses:
        '200':
          description: Account deleted
        '401':
          description: Not authenticated

  /api/user/listings:
    get:
      security:
        - Bearer: []
      tags:
        - user
      summary: Get datasets listed by current user
      parameters:
        - in: query
          name: page
          type: integer
        - in: query
          name: limit
          type: integer
      responses:
        '200':
          description: User's dataset listings

  /api/user/purchases:
    get:
      security:
        - Bearer: []
      tags:
        - user
      summary: Get datasets purchased by current user
      parameters:
        - in: query
          name: page
          type: integer
        - in: query
          name: limit
          type: integer
      responses:
        '200':
          description: User's purchases with re-download URLs

  /api/user/bounties:
    get:
      security:
        - Bearer: []
      tags:
        - user
      summary: Get bounties posted by current user
      parameters:
        - in: query
          name: page
          type: integer
        - in: query
          name: limit
          type: integer
      responses:
        '200':
          description: User's bounties

  /api/user/submissions:
    get:
      security:
        - Bearer: []
      tags:
        - user
      summary: Get submissions made by current user
      parameters:
        - in: query
          name: page
          type: integer
        - in: query
          name: limit
          type: integer
      responses:
        '200':
          description: User's submissions
