tags:
  - name: auth
    description: Wallet-based authentication (Sign-In With Algorand)

paths:
  /auth/nonce/{walletAddress}:
    get:
      tags:
        - auth
      summary: Get authentication nonce
      description: >
        Returns a unique nonce for the given wallet address. The nonce is valid for 5 minutes and must be signed and returned via /auth/verify.
        Also returns privacyConsentRequired — false when this wallet already has consentGivenAt on file (no privacy/terms modal needed before signing).
      parameters:
        - in: path
          name: walletAddress
          required: true
          type: string
          description: Algorand wallet address
      responses:
        '200':
          description: Nonce generated successfully
          schema:
            type: object
            properties:
              nonce:
                type: string
              expiresAt:
                type: number
              privacyConsentRequired:
                type: boolean
                description: True if the wallet must accept privacy/terms before verify (first-time or legacy account without consent timestamp).
        '400':
          description: walletAddress is required

  /auth/verify:
    post:
      tags:
        - auth
      summary: Verify wallet signature and issue JWT
      description: >
        Accepts a signed zero-ALGO transaction with the nonce in the note field.
        Verifies wallet ownership, creates/finds user, and returns a JWT token.
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - walletAddress
              - signedTxnBase64
              - nonce
            properties:
              walletAddress:
                type: string
                description: Algorand wallet address
              signedTxnBase64:
                type: string
                description: Base64-encoded signed transaction
              nonce:
                type: string
                description: The nonce that was obtained from /auth/nonce
              privacyConsentAccepted:
                type: boolean
                description: Required for new accounts and for legacy accounts without consent on file
      responses:
        '200':
          description: Authentication successful
          schema:
            type: object
            properties:
              token:
                type: string
              user:
                $ref: '#/definitions/User'
        '400':
          description: Missing required fields
        '401':
          description: Invalid signature or nonce

  /auth/usdc-status/{walletAddress}:
    get:
      tags:
        - auth
      summary: Check USDC opt-in status and balance
      parameters:
        - in: path
          name: walletAddress
          required: true
          type: string
      responses:
        '200':
          description: USDC status returned
          schema:
            type: object
            properties:
              isOptedIn:
                type: boolean
              usdcBalance:
                type: number

  /auth/build-optin:
    post:
      tags:
        - auth
      summary: Build USDC opt-in transaction
      description: Returns an unsigned ASA opt-in transaction for USDC (ASA 10458941)
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - walletAddress
            properties:
              walletAddress:
                type: string
      responses:
        '200':
          description: Unsigned transaction returned
          schema:
            type: object
            properties:
              unsignedTxnBase64:
                type: string

  /auth/submit-optin:
    post:
      tags:
        - auth
      summary: Submit signed USDC opt-in transaction
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - walletAddress
              - signedTxnBase64
            properties:
              walletAddress:
                type: string
              signedTxnBase64:
                type: string
      responses:
        '200':
          description: Opt-in transaction submitted
          schema:
            type: object
            properties:
              txId:
                type: string
              success:
                type: boolean

definitions:
  User:
    type: object
    properties:
      _id:
        type: string
      walletAddress:
        type: string
      consentGivenAt:
        type: string
        format: date-time
      isUSDCOptedIn:
        type: boolean
      isAdmin:
        type: boolean
      totalEarnings:
        type: number
      totalSpent:
        type: number
      createdAt:
        type: string
      updatedAt:
        type: string
