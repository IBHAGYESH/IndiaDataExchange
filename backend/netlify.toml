# India Data Exchange — API (Express as Netlify Functions)
#
# Create a SEPARATE Netlify site for the backend:
#   Site settings → Build & deploy → Base directory: backend
#   (Netlify will pick up this netlify.toml automatically.)
#
# Set all env vars from .env.sample in the Netlify UI (Site → Environment variables).
# Required: API_PUBLIC_BASE_URL=https://your-api-site.netlify.app

[build]
  command = "npm ci && npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY = "true"
  # Install devDependencies (typescript, shx, tsc-alias) during `npm ci`
  NPM_CONFIG_PRODUCTION = "false"
  # Public defaults / samples / TEAL artifacts — not leaked credentials (see Netlify secrets scanning)
  SECRETS_SCAN_OMIT_PATHS = ".env.sample,src/config.ts,src/swagger/**,AlgoKit/**,.gitignore,dist/**"
  SECRETS_SCAN_OMIT_KEYS = "FACILITATOR_URL,USDC_ASSET_ID,ALGORAND_INDEXER_URL,ALGORAND_TESTNET_URL,NODE_ENV,RATE_LIMIT_WINDOW_MS"

[functions]
  node_bundler = "esbuild"
  included_files = ["dist/**"]

[functions.api]
  timeout = 26

# Route all HTTP paths to the single Express handler
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
